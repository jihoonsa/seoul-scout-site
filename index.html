<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seoul Scout</title>
  <meta name="description" content="Find where to open a shop in Seoul: areas worth a look per trade, foot traffic, closures and rent on one map.">
  <link rel="icon" href="mark.svg" type="image/svg+xml">
  <link rel="preload" href="vendor/pretendard/Pretendard-Regular.subset.woff2" as="font" type="font/woff2" crossorigin>
  <!-- the panel's numbers come from this file: start it while the map library loads -->
  <link rel="preload" href="data/dongs.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="vendor/maplibre-gl-5.24.0/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- The top bar, across the whole window: brand, search, the trade menu and the customer map, then compare, the
         map view menu, language and help (top bar design 5.2). Each menu drops down under its button (bar-menu.js). -->
    <header id="top-bar" class="top-bar">
      <div class="brand-mark">
        <img class="mark" src="mark.svg" alt="" width="28" height="28">
        <p class="brand">Seoul Scout</p>
      </div>
      <div class="search-box">
        <span class="search-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="7.5" cy="7.5" r="5.25"/><path d="M11.5 11.5l4.5 4.5"/></svg></span>
        <input id="search" type="search" autocomplete="off" aria-label="search">
        <ul id="search-results" class="search-results" hidden></ul>
      </div>
      <div class="bar-item">
        <button type="button" id="trade-menu-button" class="bar-button trade-menu-button" aria-haspopup="menu"
                aria-controls="trade-menu-list" disabled></button>
        <div id="trade-menu-list" class="bar-menu trade-menu" role="menu" hidden></div>
      </div>
      <button type="button" id="customers-open" class="text-button customers-open" aria-pressed="false"></button>
      <span class="bar-spacer"></span>
      <button type="button" id="compare-open" class="compare-open" hidden></button>
      <div class="bar-item">
        <button type="button" id="layer-toggle" class="layer-button" aria-haspopup="menu" aria-controls="layer-menu"></button>
        <!-- The map views; from zoom 14 the shop controls; with an area open below zoom 14, a note to zoom in -->
        <div id="layer-menu" class="bar-menu layer-menu" hidden>
          <div id="layer-options" class="layer-options" role="menu"></div>
          <div id="dot-filters" class="dot-filters" hidden></div>
          <p id="layer-zoom-note" class="layer-zoom-note" hidden></p>
        </div>
      </div>
      <button type="button" class="pill-button" id="language">EN</button>
      <button type="button" class="pill-button help-button" id="help">?</button>
    </header>

    <div id="map" class="map" aria-label="Map of Seoul"></div>
    <div id="tooltip" class="tooltip" hidden></div>
    <div id="store-card" class="store-card" role="dialog" hidden></div>

    <!-- The map's corners: top left the zoom hint and the loading pill; bottom left the shop key, then the time strip -->
    <div class="map-corner top-left">
      <div id="zoom-hint" class="hint-pill"></div>
      <div id="dots-loading" class="hint-pill loading" hidden></div>
    </div>
    <div class="map-corner bottom-left">
      <div id="shop-key" class="card" hidden></div>
      <div id="time-strip" class="card" hidden></div>
    </div>

    <!-- Right (bottom on phones): the answer. On desktop it can be resized with the handle and folded (panel.js). -->
    <div id="panel" class="panel">
      <div id="panel-handle" class="panel-handle" role="separator" aria-orientation="vertical"
           aria-valuemin="25" aria-valuemax="70" tabindex="0"></div>
      <button type="button" id="panel-fold" class="panel-fold" aria-expanded="true"></button>
      <aside id="sheet" class="card sheet" aria-live="polite">
        <button type="button" class="sheet-handle" id="sheet-toggle" aria-label="expand"><span></span></button>
        <!-- The panel's first block, off the map (D127): what the colour shows, how to read it, where the chosen area stands (D95) -->
        <div id="map-headline" class="map-headline" aria-live="polite" hidden></div>
        <div id="sheet-body"></div>
        <p class="sources" id="sources"></p>
      </aside>
    </div>

    <!-- Right edge: zoom -->
    <div class="zoom-controls card">
      <button type="button" id="zoom-in">+</button>
      <button type="button" id="zoom-out">−</button>
      <button type="button" id="seoul-all" class="seoul-all"></button>
    </div>

    <dialog id="compare-dialog" class="compare-dialog">
      <button type="button" class="icon-button dialog-close" id="compare-close" aria-label="close">×</button>
      <div class="dialog-body"></div>
    </dialog>

    <!-- The first-visit notice and the ? help: one dialog, filled by openHelp() in app.js -->
    <dialog id="help-dialog" class="compare-dialog help-dialog">
      <button type="button" class="icon-button dialog-close" id="help-close" aria-label="close">×</button>
      <div id="help-body"></div>
    </dialog>

    <!-- The tour: a dimmed screen with holes around what each step points at, and a card; built by tour.js -->
    <dialog id="tour" class="tour" aria-labelledby="tour-title" aria-describedby="tour-body"></dialog>

    <p id="error" class="error" hidden></p>
  </div>

  <!-- MapLibre draws the map; pmtiles reads the Seoul base map file in small parts.
       Kept in vendor/ so the map does not depend on a CDN (D62). -->
  <script src="vendor/maplibre-gl-5.24.0/maplibre-gl.js"></script>
  <script src="vendor/pmtiles-4.5.0/pmtiles.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
